name: Publish CPE website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Read Pages address
        id: pages
        uses: actions/configure-pages@v5
      - name: Build bilingual website
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python tools/build-site.py --origin "$SITE_URL"
      - name: Check links, assets and SEO metadata
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python tools/check-site.py --origin "$SITE_URL"
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
